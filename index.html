<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Yeral 💖</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:black;}
canvas{display:block;}
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400&display=swap');

.mensaje{
 position:absolute;
 top:55%;
 left:50%;
 transform:translate(-50%,-50%);
 color:#ffb6c1;
 font-family:'Nunito',sans-serif;
 font-size:0.65rem;
 text-align:center;
 opacity:0;
 transition:opacity 2s ease;
 line-height:1.6;
 padding:0 18px;
 pointer-events:none;
 text-shadow:0 0 10px rgba(255,182,193,.9);
}
.boton{
 position:absolute;
 inset:0;
 display:flex;
 align-items:center;
 justify-content:center;
 color:white;
 font-size:1.1rem;
 background:rgba(0,0,0,.75);
 font-family:'Nunito',sans-serif;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div class="mensaje" id="m">
Yeral 💖<br><br>
Esto es algo sencillo, pero hecho con el corazón.<br>
Solo para recordarte lo especial que eres<br>
y lo bonito que haces todo a tu alrededor.<br><br>
Nunca olvides lo mucho que vales.<br>
Te quiero más de lo que imaginas.
</div>

<div class="boton" id="b">Toca la pantalla 💖</div>

<audio id="a" preload="auto" src="https://files.catbox.moe/rntwaq.mp3"></audio>

<script>
const c=document.getElementById("c"),x=c.getContext("2d");
function r(){c.width=innerWidth;c.height=innerHeight}
r();onresize=r;

const imgs=[
 "https://archivos.catbox.moe/8k1t5z.jpg",
 "https://files.catbox.moe/afakhs.jpg",
 "https://files.catbox.moe/g1mclc.jpg"
].map(s=>{let i=new Image();i.src=s;return i;});

let rocketY=c.height+30,started=false,exploded=false,frame=0;
let parts=[];

class P{
 constructor(x,y){
  const a=Math.random()*Math.PI*2,s=Math.random()*4+3;
  this.x=x;this.y=y;
  this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;
  this.i=imgs[Math.random()*imgs.length|0];
  this.s=Math.random()*16+14;
  this.l=180;this.a=1;
 }
 u(){
  this.vy+=0.04;
  this.x+=this.vx;
  this.y+=this.vy;
  this.l--;this.a-=0.006;
 }
 d(){
  x.globalAlpha=this.a;
  x.drawImage(this.i,this.x,this.y,this.s,this.s);
  x.globalAlpha=1;
 }
}

function boom(px,py){
 for(let i=0;i<35;i++) parts.push(new P(px,py));
}

document.getElementById("b").onclick=()=>{
 document.getElementById("b").style.display="none";
 document.getElementById("a").play();
 started=true;
};

function loop(){
 x.fillStyle="rgba(0,0,0,.25)";
 x.fillRect(0,0,c.width,c.height);

 if(started && !exploded){
  rocketY-=3;
  x.beginPath();x.arc(c.width/2,rocketY,3,0,Math.PI*2);
  x.fillStyle="white";x.fill();
  x.beginPath();x.moveTo(c.width/2,rocketY+6);
  x.lineTo(c.width/2,rocketY+20);
  x.strokeStyle="orange";x.lineWidth=2;x.stroke();

  if(rocketY<c.height/3){
   exploded=true;
   document.getElementById("m").style.opacity=1;
  }
 }

 if(exploded){
  frame++;
  if(frame===1) boom(c.width/2,rocketY);
  if(frame===25) boom(c.width/2-80,c.height/3);
  if(frame===50) boom(c.width/2+80,c.height/3+20);
 }

 for(let i=parts.length-1;i>=0;i--){
  parts[i].u();parts[i].d();
  if(parts[i].l<=0||parts[i].a<=0) parts.splice(i,1);
 }

 requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
